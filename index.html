<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple space for thoughtful, unexpected questions.">
  <title>Open Question</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --ink: #171917;
      --muted: #6d716c;
      --line: #d9ddd6;
      --surface: #ffffff;
      --canvas: #f3f5f0;
      --accent: #d7ff4f;
      --success: #26734d;
      --error: #b63b32;
      --radius: 8px;
      --shadow: 0 24px 70px rgba(31, 38, 29, 0.09);
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      letter-spacing: 0;
    }

    button, input { font: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(23, 25, 23, 0.22);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(1120px, calc(100% - 40px));
      height: 100svh;
      margin: 0 auto;
      padding: 20px 0;
    }

    .workspace {
      height: 100%;
    }

    .question-stage {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: clamp(28px, 5vw, 68px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .stage-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .question-number {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-button,
    .close-button {
      display: grid;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      place-items: center;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-size: 21px;
      line-height: 1;
      transition: background 160ms ease;
    }

    .menu-button:hover,
    .close-button:hover { background: var(--canvas); }

    .menu-icon,
    .close-icon {
      display: block;
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .question-wrap {
      display: flex;
      flex: 1;
      min-height: 0;
      align-items: center;
      overflow: hidden;
      padding: 60px 0;
    }

    #question {
      max-width: 780px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 5.5vw, 4.7rem);
      font-weight: 400;
      line-height: 1.08;
      text-wrap: balance;
      transition: opacity 150ms ease, transform 150ms ease;
    }

    #question.fade {
      opacity: 0;
      transform: translateY(8px);
    }

    .stage-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 20px;
      padding-top: 26px;
    }

    .primary-button,
    .upload-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 750;
      transition: background 160ms ease, transform 100ms ease;
    }

    .primary-button {
      min-height: 52px;
      padding: 0 22px;
      border: 0;
      background: var(--ink);
      color: #ffffff;
    }

    .primary-button:hover {
      background: #343934;
    }

    .primary-button:active,
    .upload-button:active { transform: translateY(1px); }

    .side-panel {
      position: fixed;
      z-index: 20;
      top: 0;
      right: 0;
      width: min(380px, 100%);
      height: 100svh;
      padding: 28px;
      overflow-y: auto;
      background: var(--surface);
      box-shadow: -20px 0 60px rgba(23, 25, 23, 0.14);
      transform: translateX(100%);
      visibility: hidden;
      transition: transform 220ms ease, visibility 220ms ease;
    }

    .side-panel.open {
      transform: translateX(0);
      visibility: visible;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
    }

    .panel-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .menu-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      border: 0;
      background: rgba(23, 25, 23, 0.3);
      opacity: 0;
      visibility: hidden;
      cursor: default;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .menu-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .info-group {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .stat { min-width: 0; }
    .stat + .stat {
      margin-left: 14px;
      padding-left: 14px;
      border-left: 1px solid var(--line);
    }

    .stat-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .stat-value {
      display: block;
      overflow-wrap: anywhere;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.35;
    }

    .source-group { padding-top: 28px; }

    .source-group h2 {
      margin: 0 0 8px;
      font-size: 17px;
      line-height: 1.3;
    }

    .source-copy {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .upload-button {
      width: 100%;
      min-height: 52px;
      padding: 0 16px;
      border: 0;
      background: var(--ink);
      color: #ffffff;
    }

    .upload-button:hover { background: #343934; }
    #csvInput { display: none; }

    .status {
      min-height: 19px;
      margin-top: 13px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    @media (max-width: 820px) {
      .question-stage { height: 100%; }
    }

    @media (max-width: 560px) {
      .app-shell {
        width: min(100% - 24px, 1120px);
        padding: 12px 0;
      }

      .question-stage {
        height: 100%;
        padding: 24px 20px;
      }

      .question-wrap { padding: 44px 0; }
      #question { font-size: 2.45rem; }
      .stage-footer, .primary-button { width: 100%; }
      .side-panel { padding: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="workspace">
      <section class="question-stage" aria-labelledby="question">
        <div class="stage-head">
          <p class="eyebrow">Question of the moment</p>
          <div class="stage-actions">
            <span class="question-number" id="questionNumber">Ready</span>
            <button class="menu-button" id="menuBtn" type="button" aria-label="Open question settings" aria-expanded="false" aria-controls="settingsPanel" title="Question settings">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 6h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 18h16"></path>
              </svg>
            </button>
          </div>
        </div>

        <div class="question-wrap">
          <h1 id="question">What would you like to talk about?</h1>
        </div>

        <div class="stage-footer">
          <button class="primary-button" id="randomizeBtn" type="button">New question</button>
        </div>
      </section>

      <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>

      <aside class="side-panel" id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" aria-hidden="true">
        <div class="panel-header">
          <h2 id="settingsTitle">Question settings</h2>
          <button class="close-button" id="closeMenuBtn" type="button" aria-label="Close question settings" title="Close">
            <svg class="close-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </div>

        <div class="info-group">
          <div class="stat">
            <span class="stat-label">Source</span>
            <strong class="stat-value" id="sourceName">Default set</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Questions</span>
            <strong class="stat-value" id="libraryCount">15</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Drawn</span>
            <strong class="stat-value" id="drawCount">0</strong>
          </div>
        </div>

        <div class="source-group">
          <h2>Use your own list</h2>
          <p class="source-copy">Choose a CSV file with one question in each row.</p>
          <button class="upload-button" id="chooseFileBtn" type="button">Choose CSV file</button>
          <input type="file" id="csvInput" accept=".csv,text/csv">
          <div class="status" id="status" role="status" aria-live="polite"></div>
        </div>
      </aside>
    </div>
  </main>

  <script>
    const CSV_FILENAME = 'question.csv';

    let questions = [
      "What's a skill you've always wanted to learn?",
      "What's the best piece of advice you've ever received?",
      "If you could travel anywhere right now, where would you go?",
      "What's your favorite way to spend a weekend?",
      "What's a book or movie that changed how you think?",
      "If you could have dinner with anyone, living or dead, who would it be?",
      "What's something you're proud of that most people don't know about?",
      "What's your go-to comfort food?",
      "If you had an extra hour every day, how would you use it?",
      "What's the most useful app on your phone?",
      "What's a habit you're trying to build or break?",
      "What's the best trip you've ever taken?",
      "If you could master any instrument instantly, which would you pick?",
      "What's something that always makes you laugh?",
      "What's a goal you're working toward this year?"
    ];

    const questionEl = document.getElementById('question');
    const questionNumberEl = document.getElementById('questionNumber');
    const randomizeBtn = document.getElementById('randomizeBtn');
    const sourceNameEl = document.getElementById('sourceName');
    const libraryCountEl = document.getElementById('libraryCount');
    const drawCountEl = document.getElementById('drawCount');
    const chooseFileBtn = document.getElementById('chooseFileBtn');
    const csvInput = document.getElementById('csvInput');
    const statusEl = document.getElementById('status');
    const menuBtn = document.getElementById('menuBtn');
    const closeMenuBtn = document.getElementById('closeMenuBtn');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const settingsPanel = document.getElementById('settingsPanel');

    let lastIndex = -1;
    let count = 0;

    function getRandomIndex() {
      if (questions.length <= 1) return 0;

      let index;
      do {
        index = Math.floor(Math.random() * questions.length);
      } while (index === lastIndex);
      return index;
    }

    function fitQuestionText() {
      const questionWrap = questionEl.parentElement;
      const minimumSize = window.matchMedia('(max-width: 560px)').matches ? 28 : 36;

      questionEl.style.fontSize = '';
      let currentSize = parseFloat(window.getComputedStyle(questionEl).fontSize);

      while (questionEl.scrollHeight > questionWrap.clientHeight && currentSize > minimumSize) {
        currentSize -= 1;
        questionEl.style.fontSize = `${currentSize}px`;
      }
    }

    function showRandomQuestion() {
      if (questions.length === 0) {
        questionEl.textContent = 'No questions are available. Choose a CSV file to continue.';
        return;
      }

      questionEl.classList.add('fade');
      window.setTimeout(() => {
        const index = getRandomIndex();
        lastIndex = index;
        count += 1;
        questionEl.textContent = questions[index];
        questionNumberEl.textContent = `Question ${count}`;
        drawCountEl.textContent = count;
        fitQuestionText();
        questionEl.classList.remove('fade');
      }, 150);
    }

    function setQuestionLibrary(rows, sourceLabel) {
      const parsedQuestions = rows
        .map((row) => (row[0] || '').trim())
        .filter((cell) => cell.length > 0);

      if (parsedQuestions[0]?.toLowerCase() === 'question') {
        parsedQuestions.shift();
      }

      if (parsedQuestions.length === 0) {
        statusEl.textContent = 'No questions were found in that file.';
        statusEl.className = 'status error';
        return false;
      }

      questions = parsedQuestions;
      lastIndex = -1;
      count = 0;
      sourceNameEl.textContent = sourceLabel;
      libraryCountEl.textContent = questions.length;
      drawCountEl.textContent = '0';
      questionNumberEl.textContent = 'Ready';
      questionEl.textContent = 'Your question deck is ready.';
      fitQuestionText();
      statusEl.textContent = `${questions.length} questions loaded`;
      statusEl.className = 'status success';
      return true;
    }

    randomizeBtn.addEventListener('click', showRandomQuestion);
    chooseFileBtn.addEventListener('click', () => csvInput.click());

    function setMenuOpen(isOpen) {
      settingsPanel.classList.toggle('open', isOpen);
      menuBackdrop.classList.toggle('open', isOpen);
      settingsPanel.setAttribute('aria-hidden', String(!isOpen));
      menuBtn.setAttribute('aria-expanded', String(isOpen));

      if (isOpen) {
        closeMenuBtn.focus();
      } else {
        menuBtn.focus();
      }
    }

    menuBtn.addEventListener('click', () => setMenuOpen(true));
    closeMenuBtn.addEventListener('click', () => setMenuOpen(false));
    menuBackdrop.addEventListener('click', () => setMenuOpen(false));

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && settingsPanel.classList.contains('open')) {
        setMenuOpen(false);
      }
    });

    window.addEventListener('resize', fitQuestionText);

    csvInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      Papa.parse(file, {
        complete: (results) => setQuestionLibrary(results.data, file.name),
        error: (error) => {
          statusEl.textContent = `Couldn't read that file: ${error.message}`;
          statusEl.className = 'status error';
        }
      });
    });

    function loadCsvFromRepo() {
      statusEl.textContent = `Loading ${CSV_FILENAME}...`;
      statusEl.className = 'status';

      fetch(CSV_FILENAME)
        .then((response) => {
          if (!response.ok) throw new Error(`File not found (${response.status})`);
          return response.text();
        })
        .then((text) => {
          const results = Papa.parse(text.trim());
          setQuestionLibrary(results.data, CSV_FILENAME);
        })
        .catch(() => {
          sourceNameEl.textContent = 'Default set';
          libraryCountEl.textContent = questions.length;
          statusEl.textContent = 'Using the built-in questions. You can also choose a CSV file.';
          statusEl.className = 'status';
        });
    }

    loadCsvFromRepo();
  </script>
</body>
</html>
